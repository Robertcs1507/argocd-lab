server {
    listen 80;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Tudo que chegar em /api/
    # será encaminhado para o backend Python
    location /api/ {
        proxy_pass http://backend-python.estudos.svc.cluster.local:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
