apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops
  namespace: estudos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gitops
  template:
    metadata:
      labels:
        app: nginx-gitops
    spec:
      containers:
      - name: nginx
        image: ghcr.io/robertcs1507/argocd-lab:a9dd2ecc299fe13e1e5a7e59f94028fb7e846433
        ports:
        - containerPort: 80
