apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops
  namespace: estudos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gitops
  template:
    metadata:
      labels:
        app: nginx-gitops
    spec:
      containers:
      - name: nginx
        image: ghcr.io/robertcs1507/argocd-lab:ce1d81719851c56dcd7418564492c538940fb43c
        ports:
        - containerPort: 80
