apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops
  namespace: estudos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gitops
  template:
    metadata:
      labels:
        app: nginx-gitops
    spec:
      containers:
      - name: nginx
        image: ghcr.io/robertcs1507/argocd-lab:caf6fcb03ec7aa12f9a04b2707c9200bc4456b5e
        ports:
        - containerPort: 80
