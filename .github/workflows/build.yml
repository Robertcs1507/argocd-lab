name: Build e Deploy GitOps

# Executa quando houver push na branch main
# com alterações dentro do diretório app/.
on:
  push:
    branches:
      - main
    paths:
      - "app/**"

# Permissões utilizadas pelo GITHUB_TOKEN
permissions:
  contents: write
  packages: write


jobs:

  # ============================================================
  # JOB 1 - TEST
  # Testa a aplicação antes de publicar a imagem.
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:

      # Baixa o código do repositório para o Runner.
      - name: Baixar codigo
        uses: actions/checkout@v4

      # Constrói uma imagem temporária para teste.
      - name: Construir imagem para teste
        run: |
          docker build -t app-teste ./app

      # Sobe um container Nginx usando a imagem criada.
      #
      # Porta 8080 do Runner -> porta 80 do container.
      - name: Subir aplicacao para teste
        run: |
          docker run -d \
            --name app-teste \
            -p 8080:80 \
            app-teste

      # Mostra o estado e os logs do container.
      #
      # Isso ajuda a descobrir problemas de inicialização
      # do Nginx, configuração, DNS, proxy etc.
      - name: Verificar container
        run: |
          echo "===== CONTAINERS ====="
          docker ps -a

          echo ""
          echo "===== LOGS DO NGINX ====="
          docker logs app-teste

      # Testa se o Nginx realmente está respondendo
      # e se o conteúdo esperado está presente.
      - name: Testar aplicacao
        run: |
          sleep 3

          echo "===== RESPOSTA DO NGINX ====="
          curl -v http://localhost:8080/

          echo ""
          echo "===== TESTE DO CONTEUDO ====="
          curl -fs http://localhost:8080/ | grep "CI/CD + GitOps funcionando!"


  # ============================================================
  # JOB 2 - BUILD
  #
  # Só será executado se o job TEST terminar com sucesso.
  # ============================================================
  build:
    needs: test

    runs-on: ubuntu-latest

    steps:

      # Baixa novamente o repositório.
      #
      # fetch-depth: 0 traz todo o histórico Git porque
      # posteriormente faremos commit do deployment.yaml.
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Autentica no GitHub Container Registry.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Constrói a imagem oficial e publica no GHCR.
      #
      # São criadas duas tags:
      #
      # SHA    -> versão exata relacionada ao commit
      # latest -> versão mais recente
      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/robertcs1507/argocd-lab:${{ github.sha }}
            ghcr.io/robertcs1507/argocd-lab:latest

      # Atualiza o deployment.yaml para utilizar
      # exatamente a imagem criada neste commit.
      - name: Atualizar imagem no deployment
        run: |
          sed -i "s|image: ghcr.io/robertcs1507/argocd-lab:.*|image: ghcr.io/robertcs1507/argocd-lab:${GITHUB_SHA}|" deployment.yaml

          echo "Imagem definida no deployment:"
          grep "image:" deployment.yaml

      # Faz commit da alteração do deployment.yaml.
      #
      # Depois disso o Argo CD detectará a mudança
      # e sincronizará o Kubernetes.
      - name: Commit e Push do manifesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no deployment.yaml"
          else
            git commit -m "Atualiza imagem para ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi