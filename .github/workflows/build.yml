name: Build e Deploy GitOps

on:
  push:
    branches:
      - main
    paths:
      - "app/**"

permissions:
  contents: write
  packages: write

jobs:

  # ============================================================
  # JOB 1 - TEST
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      # Cria a imagem que sera validada pela CI.
      - name: Construir imagem para teste
        run: |
          docker build -t app-teste ./app

      # O DNS backend-python.estudos.svc.cluster.local existe
      # somente dentro do Kubernetes.
      #
      # No Runner do GitHub criamos temporariamente uma entrada
      # para que o nginx consiga validar a configuracao.
      #
      # nginx -t verifica a sintaxe/configuracao sem precisar
      # acessar realmente o backend.
      - name: Validar configuracao do Nginx
        run: |
          docker run --rm \
            --add-host=backend-python.estudos.svc.cluster.local:127.0.0.1 \
            app-teste \
            nginx -t


  # ============================================================
  # JOB 2 - BUILD
  # So executa se o TEST passar.
  # ============================================================
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/robertcs1507/argocd-lab:${{ github.sha }}
            ghcr.io/robertcs1507/argocd-lab:latest

      - name: Atualizar imagem no deployment
        run: |
          sed -i "s|image: ghcr.io/robertcs1507/argocd-lab:.*|image: ghcr.io/robertcs1507/argocd-lab:${GITHUB_SHA}|" deployment.yaml

          echo "Imagem definida no deployment:"
          grep "image:" deployment.yaml

      - name: Commit e Push do manifesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no deployment.yaml"
          else
            git commit -m "Atualiza imagem para ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi